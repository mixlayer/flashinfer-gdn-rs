[workspace]
members = [
    "crates/cutedsl-jit",
    "crates/flashinfer-gdn-sys",
    "crates/flashinfer-gdn",
    "crates/candle-flashinfer-gdn",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
candle = { version = "0.9.2", git = "https://github.com/mixlayer/candle", package = "candle-core", branch = "fix/add-i16-i32-cuda-kernels", features = ["cuda"] }
cutedsl-jit = { version = "0.1.0", path = "crates/cutedsl-jit" }
flashinfer-gdn-sys = { version = "0.1.0", path = "crates/flashinfer-gdn-sys" }
flashinfer-gdn = { version = "0.1.0", path = "crates/flashinfer-gdn" }
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
